services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: numeris229-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      # Redirige vers l'instance Ollama de l'hote Windows/macOS depuis le conteneur
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    profiles:
      - ollama-local
    image: ollama/ollama:latest
    container_name: numeris229-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
